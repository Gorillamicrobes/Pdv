<title>PDV Gorilla · Expo Cannabis 2026</title>
<style>
  :root{
    --preto:#0A0A0A; --ouro:#F5C518; --ivory:#EDE6D6; --cinza:#8A8A8A;
    --verde:#3FA34D; --vermelho:#D93A3F; --verde-s:#F1F6EC; --amar-s:#FFF6D9; --laranja:#E8761A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; padding:0; background:var(--ivory); color:var(--preto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; }
  button{ cursor:pointer; font-family:inherit; }

  .top{ background:var(--preto); color:var(--ivory); padding:calc(8px + env(safe-area-inset-top)) 12px 10px; position:sticky; top:0; z-index:20; }
  .top .row1{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .g{ width:32px; height:32px; border-radius:8px; background:var(--ouro); color:var(--preto);
    font-weight:800; font-size:19px; display:flex; align-items:center; justify-content:center; }
  .brand .nm{ font-weight:800; font-size:14px; letter-spacing:.3px; line-height:1; }
  .brand .nm small{ display:block; font-weight:600; font-size:10px; color:#9a9a9a; margin-top:3px; letter-spacing:.3px; }
  .brand .nm small b{ color:#6fd17c; font-weight:700; }
  .lockbtn{ border:1.5px solid #3a3a3a; background:#1c1c1c; color:var(--ivory); border-radius:10px; padding:7px 11px; font-size:13px; font-weight:700; }
  .lockbtn.on{ border-color:var(--ouro); color:var(--ouro); }
  .diaseg{ display:flex; gap:4px; margin-top:9px; background:#1c1c1c; padding:3px; border-radius:11px; }
  .diaseg button{ flex:1; border:none; background:transparent; color:#9a9a9a; font-weight:700; font-size:13px; padding:7px 2px; border-radius:8px; }
  .diaseg button.on{ background:var(--ouro); color:var(--preto); }
  .diaseg button span{ display:block; font-size:10px; font-weight:700; opacity:.7; margin-top:1px; }
  .banner{ margin-top:8px; background:var(--ouro); color:var(--preto); border-radius:10px; padding:9px 11px; font-weight:800; font-size:14px; text-align:center; letter-spacing:.2px; }
  .banner small{ display:block; font-weight:700; font-size:11px; margin-top:2px; opacity:.75; }
  .banner.alerta{ background:var(--vermelho); color:#fff; }
  .banner.alerta button{ margin-top:7px; background:#fff; color:var(--vermelho); border:none; border-radius:8px; padding:7px 12px; font-weight:800; font-size:13px; }
  .aviso-topo{ margin-top:7px; border-radius:9px; padding:7px 10px; font-size:11.5px; font-weight:700; line-height:1.35; }
  .aviso-topo.verm{ background:var(--vermelho); color:#fff; }
  .aviso-topo.amar{ background:var(--amar-s); color:#5a4500; }

  .tabs{ position:sticky; bottom:0; z-index:20; display:flex; background:var(--preto);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:6px; }
  .tabs button{ flex:1; border:none; background:transparent; color:#9a9a9a; font-weight:700; font-size:11px; padding:8px 2px 6px; border-radius:9px; }
  .tabs button .ic{ display:block; font-size:19px; margin-bottom:2px; }
  .tabs button.on{ color:var(--ouro); background:#1c1c1c; }

  .page{ padding:14px 12px 20px; }
  .page h2{ font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--cinza); margin:2px 0 12px; font-weight:800; }

  .pedhead{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .pedhead .n{ font-size:26px; font-weight:800; }
  .pedhead .n span{ color:var(--cinza); font-size:14px; font-weight:700; }
  .pedhead .est{ font-size:11px; color:var(--cinza); font-weight:600; text-align:right; }

  .editbar{ background:var(--laranja); color:#fff; border-radius:12px; padding:10px 12px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:800; font-size:14px; }
  .editbar button{ background:#fff; color:var(--laranja); border:none; border-radius:9px; padding:8px 12px; font-weight:800; font-size:13px; }

  .bloco{ background:#fff; border:1.5px solid #E0DACB; border-radius:14px; padding:12px; margin-bottom:12px; }
  .bloco .lb{ font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--cinza); font-weight:800; margin-bottom:8px; }

  .chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .chip{ border:1.5px solid #D8D2C4; background:#fff; color:var(--preto); border-radius:20px; padding:10px 16px; font-size:15px; font-weight:700; }
  .chip.on{ background:var(--preto); color:var(--ivory); border-color:var(--preto); }

  .campo{ width:100%; border:1.5px solid #D8D2C4; background:#fff; border-radius:10px; padding:12px 14px; font-size:16px; color:var(--preto); font-family:inherit; }
  .campo::placeholder{ color:#B5AE9E; }
  .campo:focus{ outline:none; border-color:var(--preto); }

  .brinde-toggle{ display:flex; align-items:center; justify-content:space-between; background:#fff; border:1.5px solid #D8D2C4; border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .brinde-toggle.on{ border-color:var(--verde); background:var(--verde-s); }
  .brinde-toggle .txt{ font-weight:800; font-size:14px; }
  .brinde-toggle .txt small{ display:block; font-weight:600; font-size:11px; color:var(--cinza); margin-top:3px; }
  .switch{ width:50px; height:29px; border-radius:20px; background:#D0CABA; position:relative; transition:background .15s; flex:none; }
  .switch.on{ background:var(--verde); }
  .switch .knob{ position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .switch.on .knob{ left:24px; }

(function(){
  "use strict";

  var EVENTO = "Expo Cannabis Brasil 2026";
  var LIBERACAO_MS = 5*60*1000;

  /* Preços = tabela do cardápio (preço cheio) com 20% OFF. Editáveis na configuração. */
  function r2(x){ return Math.round(x*100)/100; }
  var CATALOGO = [
    {id:"mic250", nome:"Microbes 250ml",    curto:"Mic 250",   cat:"Microbes", lista:80},
    {id:"mic1l",  nome:"Microbes 1000ml",   curto:"Mic 1L",    cat:"Microbes", lista:175},
    {id:"mic5l",  nome:"Microbes 5000ml",   curto:"Mic 5L",    cat:"Microbes", lista:null, fixo:479.00},
    {id:"bl50",   nome:"ProMix Black 50g",  curto:"Black 50",  cat:"Black",    lista:140},
    {id:"bl100",  nome:"ProMix Black 100g", curto:"Black 100", cat:"Black",    lista:240},
    {id:"bl250",  nome:"ProMix Black 250g", curto:"Black 250", cat:"Black",    lista:589},
    {id:"gd50",   nome:"ProMix Gold 50g",   curto:"Gold 50",   cat:"Gold",     lista:240},
    {id:"gd100",  nome:"ProMix Gold 100g",  curto:"Gold 100",  cat:"Gold",     lista:460},
    {id:"gd200",  nome:"ProMix Gold 200g",  curto:"Gold 200",  cat:"Gold",     lista:790},
    {id:"gel",    nome:"Gorilla Roots 10g", curto:"Roots 10g", cat:"Roots",    lista:null, fixo:39.90}
  ];
  CATALOGO.forEach(function(p){ p.padrao = p.lista!=null ? r2(p.lista*0.8) : p.fixo; });

  var VENDEDORES = ["LUKETA","LEO","RAFAEL","LUANA","FABI"];
  var PAGAMENTOS = [{id:"pix",nome:"Pix"},{id:"cartao",nome:"Cartão"},{id:"dinheiro",nome:"Dinheiro"}];
  var CAT_CORES = {Microbes:"#4A7BA6", Black:"#2A2A2A", Gold:"#B8912E", Roots:"#6B8E4E"};
  var DIAS = [
    {id:"d1", rot:"Dia 1", base:1001, data:"2026-11-20", dm:"20/11", sem:"SEXTA"},
    {id:"d2", rot:"Dia 2", base:2001, data:"2026-11-21", dm:"21/11", sem:"SÁBADO"},
    {id:"d3", rot:"Dia 3", base:3001, data:"2026-11-22", dm:"22/11", sem:"DOMINGO"}
  ];

  /* ---------- utilidades ---------- */
  function $(id){ return document.getElementById(id); }
  function agora(){ return window.__AGORA ? new Date(window.__AGORA) : new Date(); }
  function p2(n){ return (n<10?"0":"")+n; }
  function hojeISO(){ var d=agora(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
  function hojeDM(){ var d=agora(); return p2(d.getDate())+"/"+p2(d.getMonth()+1); }
  function hhmmss(d){ return p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds()); }
  function brl(v){ return "R$ " + Number(v).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,"."); }
  function num2(v){ return Number(v).toFixed(2).replace(".",","); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function diaObj(id){ return DIAS.filter(function(x){return x.id===id;})[0]; }
  function prodObj(id){ return CATALOGO.filter(function(p){return p.id===id;})[0]; }
  function diaDeHoje(){
    var h=hojeISO();
    for(var i=0;i<DIAS.length;i++) if(DIAS[i].data===h) return DIAS[i].id;
    return null;
  }
  function diaInicial(){
    var d=diaDeHoje(); if(d) return d;
    return hojeISO()<DIAS[0].data ? "d1" : "d3";
  }

  /* ---------- armazenamento ---------- */
  var K = {
    pedidos:"gorilla:ecb26:pedidos", seq:"gorilla:ecb26:seq", estoqueIni:"gorilla:ecb26:estoqueIni",
    precos:"gorilla:ecb26:precos", pin:"gorilla:ecb26:pin", configFeita:"gorilla:ecb26:configFeita"
  };
  var semStorage = false, memStore = {};
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ semStorage = true; }
  function lerLS(k){ try{ if(semStorage) return memStore[k]==null?null:memStore[k]; return localStorage.getItem(k); }catch(e){ return null; } }
  function gravarLS(k,v){ try{ if(semStorage){ memStore[k]=v; return true; } localStorage.setItem(k,v); return true; }catch(e){ return false; } }
  function carregar(k,fb){ try{ var r=lerLS(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  /* ---------- estado ---------- */
  var S = {
    pedidos: carregar(K.pedidos,{d1:[],d2:[],d3:[]}),
    seq: carregar(K.seq,{d1:1001,d2:2001,d3:3001}),
    estoqueIni: carregar(K.estoqueIni,{}),
    precos: carregar(K.precos,{}),
    pin: carregar(K.pin,""),
    configFeita: carregar(K.configFeita,false),
    reabrirConfig:false, cfgQtd:null, cfgPreco:null,
    dia: null, aba:"novo",
    vend:null, pag:null, cliente:"", carrinho:{}, ehBrinde:false, brindeNome:"", brindeInsta:"", recebido:"",
    editando:null, editPrecos:null, salvando:false,
    liberadoAte:0, modal:null, pinDepois:null, painelDia:null,
    salvoEm:null, erroSalvar:false
  };
  ["d1","d2","d3"].forEach(function(d){ if(!S.pedidos[d]) S.pedidos[d]=[]; if(!S.seq[d]) S.seq[d]=diaObj(d).base; });
  S.dia = diaInicial();
  S.painelDia = S.dia;

  function salvarTudo(){
    var ok = gravarLS(K.pedidos,JSON.stringify(S.pedidos)) &&
             gravarLS(K.seq,JSON.stringify(S.seq)) &&
             gravarLS(K.estoqueIni,JSON.stringify(S.estoqueIni)) &&
             gravarLS(K.precos,JSON.stringify(S.precos)) &&
             gravarLS(K.pin,JSON.stringify(S.pin)) &&
             gravarLS(K.configFeita,JSON.stringify(S.configFeita));
    if(ok){ S.salvoEm = agora(); S.erroSalvar=false; }
    else { S.erroSalvar=true; flash("ERRO AO SALVAR. Avise a Fabi agora.",true); }
    return ok;
  }

  /* ---------- regras de negócio ---------- */
  function precoAtual(id){
    var v = S.precos[id];
    if(v==null || isNaN(v) || v<=0) v = prodObj(id).padrao;
    return v;
  }
  function precoItem(id){
    if(S.editPrecos && S.editPrecos[id]!=null) return S.editPrecos[id];
    return precoAtual(id);
  }
  function vendidoTotal(excluir){
    var acc={}; CATALOGO.forEach(function(p){acc[p.id]=0;});
    ["d1","d2","d3"].forEach(function(d){
      (S.pedidos[d]||[]).forEach(function(ped){
        if(excluir && excluir.dia===d && excluir.num===ped.num) return;
        ped.itens.forEach(function(it){ acc[it.id]=(acc[it.id]||0)+it.qtd; });
      });
    });
    return acc;
  }
  function saldos(){
    var v=vendidoTotal(S.editando), s={};
    CATALOGO.forEach(function(p){ s[p.id]=(S.estoqueIni[p.id]||0)-(v[p.id]||0); });
    return s;
  }
  function totalCarrinho(){
    if(S.ehBrinde) return 0;
    var t=0; CATALOGO.forEach(function(p){ t += (S.carrinho[p.id]||0)*precoItem(p.id); });
    return r2(t);
  }
  function totalItens(){ var t=0; for(var k in S.carrinho) t+=S.carrinho[k]; return t; }

  function resumoDia(d){
    var lista=S.pedidos[d]||[];
    var vendas=lista.filter(function(p){return !p.brinde;});
    var brindes=lista.filter(function(p){return p.brinde;});
    var fat=r2(vendas.reduce(function(a,p){return a+p.total;},0));
    var porVend={}; VENDEDORES.forEach(function(v){porVend[v]={un:0,val:0};});
    var porPag={pix:0,cartao:0,dinheiro:0};
    var porProd={}; CATALOGO.forEach(function(p){porProd[p.id]={venda:0,brinde:0};});
    vendas.forEach(function(p){
      var un=p.itens.reduce(function(a,i){return a+i.qtd;},0);
      if(!porVend[p.vendedor]) porVend[p.vendedor]={un:0,val:0};
      porVend[p.vendedor].un+=un; porVend[p.vendedor].val=r2(porVend[p.vendedor].val+p.total);
      if(porPag[p.pagamento]==null) porPag[p.pagamento]=0;
      porPag[p.pagamento]=r2(porPag[p.pagamento]+p.total);
      p.itens.forEach(function(i){ if(porProd[i.id]) porProd[i.id].venda+=i.qtd; });
    });
    var unBrinde=0;
    brindes.forEach(function(p){ p.itens.forEach(function(i){ if(porProd[i.id]) porProd[i.id].brinde+=i.qtd; unBrinde+=i.qtd; }); });
    var unVend=vendas.reduce(function(a,p){return a+p.itens.reduce(function(x,i){return x+i.qtd;},0);},0);
    return {lista:lista,vendas:vendas,brindes:brindes,fat:fat,porVend:porVend,porPag:porPag,porProd:porProd,unVend:unVend,unBrinde:unBrinde};
  }

  /* ---------- PIN ---------- */
  function liberado(){ return Date.now() < S.liberadoAte; }
  function requer(acao){
    if(liberado()){ acao(); return; }
    S.pinDepois = acao; S.modal = {t:"pin"}; render(); setTimeout(function(){ var i=$("pin-in"); if(i) i.focus(); },60);
  }
  function bloquear(){ S.liberadoAte=0; if(S.modal && S.modal.t==="gestora") S.modal=null; render(); }
  setInterval(function(){
    if(S.liberadoAte && Date.now()>=S.liberadoAte){ S.liberadoAte=0; if(S.modal && S.modal.t==="gestora") S.modal=null; render(); }
  },5000);

  /* ---------- feedback / tela ligada ---------- */
  function flash(msg,erro){
    var t=document.createElement("div"); t.className="toast"+(erro?" erro":""); t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, erro?4500:1800);
  }
  var wl=null;
  function pedirWake(){
    try{ if(navigator.wakeLock && !wl){ navigator.wakeLock.request("screen").then(function(l){ wl=l; l.addEventListener("release",function(){ wl=null; }); }).catch(function(){}); } }catch(e){}
  }
  document.addEventListener("click",pedirWake);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) pedirWake(); });

  /* ---------- ações do caixa ---------- */
  function irTopo(){ try{ window.scrollTo(0,0); }catch(e){} }
  function add(p){
    var s=saldos(); var atual=S.carrinho[p.id]||0;
    if(atual>=s[p.id]){ flash("Sem estoque de "+p.curto); return; }
    S.carrinho[p.id]=atual+1; render();
  }
  function sub(p){
    var atual=S.carrinho[p.id]||0; if(atual<=0) return;
    if(atual-1===0) delete S.carrinho[p.id]; else S.carrinho[p.id]=atual-1;
    render();
  }
  function limparForm(){
    S.vend=null; S.pag=null; S.cliente=""; S.carrinho={}; S.ehBrinde=false;
    S.brindeNome=""; S.brindeInsta=""; S.recebido=""; S.editando=null; S.editPrecos=null;
  }
  function trocarDia(id){
    if(id===S.dia) return;
    var d=diaObj(id);
    var aviso="Trocar para "+d.rot+" ("+d.dm+")? Os próximos pedidos passam a ser "+d.base+" em diante.";
    if(S.editando) aviso += " A edição em andamento será cancelada.";
    if(!confirm(aviso)) return;
    limparForm(); S.dia=id; S.painelDia=id; render(); irTopo();
  }
  function salvar(){
    if(S.salvando) return;
    if(!S.vend){ flash("Escolha o vendedor"); return; }

    if(S.ehBrinde){ if(!S.brindeNome.trim()){ flash("Digite o nome de quem ganhou o brinde"); return; } }
    else if(!S.pag){ flash("Escolha a forma de pagamento"); return; }
    var s=saldos();
    for(var k in S.carrinho){ if(S.carrinho[k]>(s[k]||0)){ flash("Sem estoque de "+prodObj(k).curto,true); return; } }
    S.salvando=true;
    try{
      var itens=CATALOGO.filter(function(p){return S.carrinho[p.id];}).map(function(p){
        return {id:p.id,curto:p.curto,qtd:S.carrinho[p.id],preco:precoItem(p.id)};
      });
      var insta = S.ehBrinde && S.brindeInsta.trim() ? "@"+S.brindeInsta.trim().replace(/^@+/,"") : null;
      var base = {
        vendedor:S.vend, brinde:S.ehBrinde, pagamento:S.ehBrinde?null:S.pag,
        cliente:S.cliente.trim()||null, brindeNome:S.ehBrinde?S.brindeNome.trim():null, brindeInsta:insta,
        itens:itens, total:totalCarrinho()
      };

        var lista=S.pedidos[S.editando.dia], idx=-1;
        for(var i=0;i<lista.length;i++) if(lista[i].num===S.editando.num) idx=i;
        if(idx<0){ flash("Pedido não encontrado",true); S.editando=null; render(); return; }
        var antigo=lista[idx], novo={num:antigo.num, dia:antigo.dia, hora:antigo.hora, editadoEm:agora().toISOString()};
        for(var kk in base) novo[kk]=base[kk];
        lista[idx]=novo;
        salvarTudo(); flash("Pedido #"+novo.num+" atualizado");
      } else {
        var n=S.seq[S.dia];
        var ped={num:n, dia:S.dia, hora:agora().toISOString()};
        for(var k2 in base) ped[k2]=base[k2];
        S.pedidos[S.dia]=(S.pedidos[S.dia]||[]).concat([ped]);
        S.seq[S.dia]=n+1;
        salvarTudo(); flash((S.ehBrinde?"Brinde":"Pedido")+" #"+n+" salvo");
      }
      limparForm();
    } finally { S.salvando=false; }
    render(); irTopo();
  }

  function baixar(nome,conteudo,mime){
    try{
      var blob=new Blob([conteudo],{type:mime});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a"); a.href=url; a.download=nome;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); },1500);
    }catch(e){ flash("Não consegui gerar o arquivo. Use 'Copiar tudo em texto'.",true); }
  }
  function entregar(nome,conteudo,mime,bom){
    var texto=(bom?"﻿":"")+conteudo, file=null;
    try{ file=new File([texto],nome,{type:mime}); }catch(e){}
    if(file && navigator.share && navigator.canShare){
      var ok=false; try{ ok=navigator.canShare({files:[file]}); }catch(e){}
      if(ok){
        navigator.share({files:[file],title:nome}).catch(function(e){ if(!e || e.name!=="AbortError") baixar(nome,texto,mime); });
        return;
      }
    }
    baixar(nome,texto,mime);
  }
  function copiarTexto(txt){
    function fallback(){
      var ta=$("txt-dia"); if(ta){ ta.focus(); ta.select(); try{ ta.setSelectionRange(0,999999); }catch(e){} }
      var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
      flash(ok?"Texto copiado":"Abra 'Ver texto' e copie manualmente", !ok);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ flash("Texto copiado"); }).catch(fallback);
    } else fallback();
  }

        if(!confirm("Restaurar este backup? Isso SUBSTITUI todos os dados atuais deste aparelho.")) return;
        S.pedidos=o.pedidos; S.seq=o.seq; S.estoqueIni=o.estoqueIni||{}; S.precos=o.precos||{}; S.pin=o.pin||S.pin; S.configFeita=true;
        ["d1","d2","d3"].forEach(function(d){ if(!S.pedidos[d]) S.pedidos[d]=[]; if(!S.seq[d]) S.seq[d]=diaObj(d).base; });
        limparForm(); salvarTudo(); flash("Backup restaurado"); render();

    };
    rd.readAsText(file);
  }

      '<button class="btn preto" id="b-gestao" style="margin-bottom:14px">Resumo e fechamento do dia 🔒</button>'+
      pedHTML;
    el.querySelector("#b-gestao").onclick=function(){ requer(function(){ S.painelDia=S.dia; S.modal={t:"gestora"}; render(); }); };
    el.querySelectorAll("[data-edit]").forEach(function(b){ b.onclick=function(){ editar(parseInt(b.getAttribute("data-edit"),10)); }; });
    el.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ excluirPedido(S.dia, parseInt(b.getAttribute("data-del"),10)); }; });
    return el;
  }

  function renderEstoque(){
    var s=saldos(), v=vendidoTotal(null), lib=liberado();
    var el=document.createElement("div"); el.className="page";
    var linhas=CATALOGO.map(function(p){
      var disp=s[p.id], ini=S.estoqueIni[p.id]||0;
      var st=disp<=0?["st-zero","ESGOTADO"]:disp<=5?["st-baixo","BAIXO"]:["st-ok","OK"];
      return '<div class="est-linha"><div class="cor" style="background:'+CAT_CORES[p.cat]+'"></div>'+
        '<div class="nm">'+p.nome+(lib?'<small>inicial '+ini+' · saiu '+(v[p.id]||0)+'</small>':"")+'</div>'+
        '<div class="sal"><div class="q">'+disp+'</div><div class="st '+st[0]+'">'+st[1]+'</div></div></div>';
    }).join("");
    el.innerHTML='<h2>Estoque · saldo em tempo real</h2>'+
      '<div class="nota" style="margin-bottom:12px">Único para o evento inteiro. O que sai em qualquer dia baixa daqui.</div>'+linhas;
    return el;
  }

  function renderTabs(){
    var el=document.createElement("div"); el.className="tabs";
    el.innerHTML=
      '<button class="'+(S.aba==="novo"?"on":"")+'" data-aba="novo"><span class="ic">🧾</span>Novo pedido</button>'+
      '<button class="'+(S.aba==="pedidos"?"on":"")+'" data-aba="pedidos"><span class="ic">📋</span>Pedidos</button>'+
      '<button class="'+(S.aba==="estoque"?"on":"")+'" data-aba="estoque"><span class="ic">📦</span>Estoque</button>';
    el.querySelectorAll("[data-aba]").forEach(function(b){ b.onclick=function(){ S.aba=b.getAttribute("data-aba"); render(); irTopo(); }; });
    return el;
  }

  /* ---------- modal: PIN ---------- */
  function renderModalPin(){
    var el=document.createElement("div"); el.className="modal-bg centro";
    el.innerHTML=
      '<div class="modal centro"><div class="mh"><div class="t">PIN da gestora</div><button class="x" id="p-x">×</button></div>'+
      '<input class="campo pinin" id="pin-in" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····"/>'+
      '<div class="msgerro" id="pin-msg"></div>'+
      '<button class="btn ouro" id="pin-ok">Liberar</button></div>';
    function fechar(){ S.modal=null; S.pinDepois=null; render(); }
    function tentar(){
      var v=$("pin-in").value;
      if(v && v===String(S.pin)){
        S.liberadoAte=Date.now()+LIBERACAO_MS; S.modal=null;
        var f=S.pinDepois; S.pinDepois=null; render(); if(f) f();
      } else { $("pin-msg").textContent="PIN incorreto"; $("pin-in").value=""; }
    }
    el.querySelector("#p-x").onclick=fechar;
    el.onclick=function(ev){ if(ev.target===el) fechar(); };
    el.querySelector("#pin-ok").onclick=tentar;
    el.querySelector("#pin-in").oninput=function(){ this.value=this.value.replace(/[^0-9]/g,""); if(this.value.length===4) tentar(); };
    return el;
  }

  /* ---------- modal: gestão (resumo, fechamento, backup) ---------- */
  function renderModalGestora(){
    var d=S.painelDia||S.dia, o=diaObj(d), r=resumoDia(d), s=saldos();
    var el=document.createElement("div"); el.className="modal-bg";
    var seletor=DIAS.map(function(x){ return '<button class="'+(d===x.id?"on":"")+'" data-pdia="'+x.id+'">'+x.rot+' · '+x.dm+'</button>'; }).join("");
    var vendHTML=Object.keys(r.porVend).map(function(v){
      return '<div class="linha"><div class="l">'+esc(v)+' <small>· '+r.porVend[v].un+' un</small></div><div class="r">'+brl(r.porVend[v].val)+'</div></div>';
    }).join("");
    var pagHTML=Object.keys(r.porPag).map(function(k){
      var n=(PAGAMENTOS.filter(function(x){return x.id===k;})[0]||{nome:k}).nome;
      return '<div class="linha"><div class="l">'+n+'</div><div class="r">'+brl(r.porPag[k])+'</div></div>';
    }).join("");
    var prodHTML=CATALOGO.map(function(p){
      return '<div class="linha"><div class="l">'+p.curto+' <small>· brinde '+r.porProd[p.id].brinde+' · saldo '+s[p.id]+'</small></div><div class="r">'+r.porProd[p.id].venda+'</div></div>';
    }).join("");
    el.innerHTML=
      '<div class="modal"><div class="mh"><div class="t">Gestão · '+o.rot+'</div><button class="x" id="g-x">×</button></div>'+
      '<div class="diasel">'+seletor+'</div>'+
      '<div class="kpis">'+
      '<div class="kpi"><div class="v">'+brl(r.fat)+'</div><div class="l">Faturamento</div></div>'+
      '<div class="kpi"><div class="v">'+r.unVend+'</div><div class="l">Un. vendidas</div></div>'+
      '<div class="kpi"><div class="v">'+r.vendas.length+'</div><div class="l">Pedidos</div></div>'+
      '<div class="kpi"><div class="v">'+r.unBrinde+'</div><div class="l">Brindes (un)</div></div></div>'+
      '<div class="card"><div class="ct">Por vendedor</div>'+vendHTML+'<div class="linha tt"><div class="l">Total</div><div class="r">'+brl(r.fat)+'</div></div></div>'+
      '<div class="card"><div class="ct">Por pagamento</div>'+pagHTML+'</div>'+
      '<div class="card"><div class="ct">Por produto (unidades vendidas)</div>'+prodHTML+'</div>'+
      '<div class="aviso">Ao fechar o dia: envie os <b>2 arquivos</b> (ou copie o texto) e guarde o <b>backup</b>. Depois me mande aqui no chat.</div>'+
      '<button class="btn preto" id="g-csv1">Enviar pedidos do dia (CSV)</button>'+
      '<button class="btn preto" id="g-csv2">Enviar resumo do dia (CSV)</button>'+
      '<button class="btn ouro" id="g-copy">Copiar tudo em texto</button>'+
      '<details class="txt"><summary>Ver texto para copiar</summary><textarea id="txt-dia" readonly>'+esc(textoDia(d))+'</textarea></details>'+
      '<button class="btn ghost" id="g-bkp">Backup completo (arquivo)</button>'+
      '<label class="filebtn">Restaurar backup<input type="file" id="g-rest" accept=".json,application/json"/></label>'+
      '<button class="btn ghost" id="g-cfg" style="margin-top:9px">Ajustar estoque, preços e PIN</button>'+
      '<button class="btn verm peq" id="g-zero" style="margin-top:14px">Zerar pedidos de teste</button>'+
      '<button class="btn ghost" id="g-lock" style="margin-top:9px">🔒 Bloquear agora</button></div>';
    el.querySelector("#g-x").onclick=function(){ S.modal=null; render(); };
    el.onclick=function(ev){ if(ev.target===el){ S.modal=null; render(); } };
    el.querySelectorAll("[data-pdia]").forEach(function(b){ b.onclick=function(){ S.painelDia=b.getAttribute("data-pdia"); render(); }; });
    el.querySelector("#g-csv1").onclick=function(){ entregar(tagArquivo(d)+"_pedidos.csv",csvPedidos(d),"text/csv;charset=utf-8",true); };
    el.querySelector("#g-csv2").onclick=function(){ entregar(tagArquivo(d)+"_resumo.csv",csvResumo(d),"text/csv;charset=utf-8",true); };
    el.querySelector("#g-copy").onclick=function(){ copiarTexto(textoDia(d)); };
    el.querySelector("#g-bkp").onclick=function(){ entregar("BACKUP_PDV_ExpoCannabis2026_"+hojeDM().replace("/","-")+"_"+hhmmss(agora()).replace(/:/g,"")+".json",JSON.stringify(backupObj()),"application/json",false); };
    el.querySelector("#g-rest").onchange=function(){ if(this.files && this.files[0]) restaurar(this.files[0]); };
    el.querySelector("#g-cfg").onclick=function(){ S.modal=null; S.reabrirConfig=true; S.cfgQtd=null; S.cfgPreco=null; render(); irTopo(); };
    el.querySelector("#g-zero").onclick=zerarTeste;
    el.querySelector("#g-lock").onclick=bloquear;
    return el;
  }

  /* ---------- configuração: estoque, preços e PIN ---------- */
  function renderConfig(){
    var s = S.configFeita ? saldos() : null;
    if(!S.cfgQtd){
      S.cfgQtd={}; S.cfgPreco={};
      CATALOGO.forEach(function(p){
        S.cfgQtd[p.id]=(S.estoqueIni[p.id]!=null && S.configFeita)?String(S.estoqueIni[p.id]):"";
        S.cfgPreco[p.id]=num2(precoAtual(p.id));
      });
    }
    var wrap=document.createElement("div");
    var linhas=CATALOGO.map(function(p){
      return '<div class="est-linha"><div class="cor" style="background:'+CAT_CORES[p.cat]+'"></div>'+
        '<div class="nm">'+p.nome+(s?'<small>restam '+s[p.id]+'</small>':"")+'</div>'+
        '<input class="campo est-cfg" inputmode="decimal" data-preco="'+p.id+'" value="'+esc(S.cfgPreco[p.id])+'"/>'+
        '<input class="campo est-cfg" inputmode="numeric" placeholder="0" data-qtd="'+p.id+'" value="'+esc(S.cfgQtd[p.id])+'"/></div>';
    }).join("");
    var temPin = !!S.pin;
    wrap.innerHTML=
      '<div class="top"><div class="row1"><div class="brand"><div class="g">G</div>'+
      '<div class="nm">GORILLA MICROBES<small>CONFIGURAÇÃO · EXPO CANNABIS 2026</small></div></div></div></div>'+
      '<div class="page">'+
      (S.configFeita?"":'<div class="aviso verm"><b>Antes de configurar:</b> adicione este app à tela inicial do iPhone (Compartilhar › Adicionar à Tela de Início) e abra pelo ÍCONE. Se configurar no Safari, os dados não aparecem no ícone.</div>')+
      '<div class="aviso">Preencha <b>uma vez</b>. Os preços já vêm com <b>20% OFF</b> sobre o cardápio. Confira cada um e ajuste se precisar.'+(S.configFeita?' Alterar preço vale só para os próximos pedidos.':'')+'</div>'+
      '<div class="bloco"><div class="cfg-cab"><span>Produto</span><span>Preço R$</span><span>'+(S.configFeita?"Estoque inicial":"Estoque")+'</span></div>'+linhas+'</div>'+
      '<div class="bloco"><div class="lb">PIN da gestora (4 números)</div>'+
      '<input class="campo pinin" id="cfg-pin1" type="password" inputmode="numeric" maxlength="4" placeholder="'+(temPin?"deixe em branco para manter":"····")+'" style="margin-bottom:8px;letter-spacing:6px"/>'+
      '<input class="campo pinin" id="cfg-pin2" type="password" inputmode="numeric" maxlength="4" placeholder="repita o PIN" style="letter-spacing:6px"/>'+
      '<div class="nota">Protege faturamento, fechamento, backup, exclusão de pedidos e esta tela. A Luana não precisa saber.</div></div>'+
      '<div class="msgerro" id="cfg-msg"></div>'+
      '<button class="btn ouro" id="cfg-ok">'+(S.configFeita?"Salvar ajustes":"Começar o evento")+'</button>'+
      (S.configFeita?'<button class="btn ghost" id="cfg-cancel">Voltar sem alterar</button>':"")+
      '<div class="nota">'+(S.configFeita?"Estoque inicial é o total levado para o evento. O que já foi vendido continua sendo descontado. Para repor, some a reposição ao valor inicial.":"Digite quantas unidades de cada produto foram levadas.")+'</div></div>';
    wrap.querySelectorAll("[data-preco]").forEach(function(i){ i.oninput=function(){ S.cfgPreco[i.getAttribute("data-preco")]=i.value; }; });
    wrap.querySelectorAll("[data-qtd]").forEach(function(i){ i.oninput=function(){ i.value=i.value.replace(/[^0-9]/g,""); S.cfgQtd[i.getAttribute("data-qtd")]=i.value; }; });
    var cc=wrap.querySelector("#cfg-cancel"); if(cc) cc.onclick=function(){ S.reabrirConfig=false; S.cfgQtd=null; S.cfgPreco=null; render(); irTopo(); };
    wrap.querySelector("#cfg-ok").onclick=function(){
      var msg=$("cfg-msg"), novosPrecos={}, novoEstoque={}, algum=false;
      for(var i=0;i<CATALOGO.length;i++){
        var p=CATALOGO[i], pr=parseFloat(String(S.cfgPreco[p.id]).replace(",","."));
        if(!(pr>0)){ msg.textContent="Preço inválido em "+p.nome; return; }
        novosPrecos[p.id]=r2(pr);
        var q=parseInt(S.cfgQtd[p.id]||"0",10)||0; novoEstoque[p.id]=q; if(q>0) algum=true;
      }
      if(!algum){ msg.textContent="Digite o estoque de pelo menos 1 produto"; return; }
      var p1=$("cfg-pin1").value, p2v=$("cfg-pin2").value;
      if(!S.pin || p1 || p2v){
        if(!/^[0-9]{4}$/.test(p1)){ msg.textContent="O PIN precisa ter exatamente 4 números"; return; }
        if(p1!==p2v){ msg.textContent="Os dois PINs não são iguais"; return; }
      }
      if(S.configFeita){ var v=vendidoTotal(null); for(var j=0;j<CATALOGO.length;j++){ var id=CATALOGO[j].id; if(novoEstoque[id]<(v[id]||0)){ msg.textContent="Estoque de "+CATALOGO[j].nome+" menor do que já saiu ("+(v[id]||0)+")"; return; } } }
      S.precos=novosPrecos; S.estoqueIni=novoEstoque;
      if(p1) S.pin=p1;
      S.configFeita=true; S.reabrirConfig=false; S.cfgQtd=null; S.cfgPreco=null;
      salvarTudo(); flash("Configuração salva"); render(); irTopo();
    };
    return wrap;
  }

  render();
  window.__PDV = {S:S, render:render, DIAS:DIAS}; /* gancho para testes */
})();
</script>
</body>
</html>
